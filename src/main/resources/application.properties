spring.application.name=zyclos
server.port=8080

# ===== Banco de dados: Supabase (PostgreSQL) =====
# Usuário, senha e URL ficam no arquivo .env, que NUNCA vai para o Git (modelo: .env.example).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# O plano gratuito do Supabase aceita poucas conexões simultâneas: o pool fica pequeno
spring.datasource.hikari.maximum-pool-size=5

# Não imprime cada SQL no console (polui o log). Para depurar, troque por true temporariamente.
spring.jpa.show-sql=false
# As tabelas JÁ EXISTEM no Supabase. O Hibernate nunca cria nem altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
# O Hibernate detecta o PostgreSQL sozinho, por isso não é preciso informar o dialeto.

# ===== Autenticação (JWT) =====
# Segredo que assina os tokens: vem da variável de ambiente ZYCLOS_JWT_SECRET (ou do .env).
# Mínimo de 32 caracteres. Nunca colocar o valor real aqui.
zyclos.jwt.secret=${ZYCLOS_JWT_SECRET}
zyclos.jwt.expiracao-horas=24
# Os usuários vêm do banco (tabela usuario), não do usuário/senha gerado pelo Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
